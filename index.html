<script>
const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxUGMJ8hMuVowkrylN7zw4WzZBQ4oBP5ZiWO0TeD0Fu2uu5ytTYrgMKhpQm7Kee21VDlQ/exec";

let handled = false;
let scannerStarted = false;

async function onScanSuccess(decodedText) {
  if (handled) return;

  const id = decodedText.trim();

  if (!/^PROV-DIS-\d+$/i.test(id)) {
    document.getElementById("error").textContent =
      "That QR code is not a Providence dismissal code.";
    return;
  }

  handled = true;

  try {
    if (window.scanner) {
      await window.scanner.stop();
      await window.scanner.clear();
    }
  } catch (e) {
    console.log("Camera cleanup:", e);
  }

  // Small delay to make sure the camera is released
  setTimeout(() => {
    window.location.href =
      APPS_SCRIPT_URL + "?id=" + encodeURIComponent(id);
  }, 300);
}

function onScanFailure(errorMessage) {
  // Ignore normal QR searching messages
}

window.scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 10,
    qrbox: {
      width: 260,
      height: 260
    },
    rememberLastUsedCamera: true,
    showTorchButtonIfSupported: true,
    showZoomSliderIfSupported: true
  },
  false
);

window.scanner.render(
  onScanSuccess,
  onScanFailure
);
</script>
